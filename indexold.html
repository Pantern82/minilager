<html lang="no"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minilager - Namsos Boligeiendom</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg: #0a0a0a;
            --surface: #1a1a1a;
            --surface-elevated: #252525;
            --border: #333;
            --text: #e8e8e8;
            --text-dim: #999;
            --accent: #00ff88;
            --accent-dim: #00cc6a;
            --warning: #ffaa00;
            --danger: #ff3366;
            --success: #00ff88;
        }
        
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        
        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 2rem;
            margin-bottom: 2rem;
        }
        
        .header-top {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .logo {
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 8px;
            padding: 8px;
            flex-shrink: 0;
        }
        
        .header-content {
            flex: 1;
        }
        
        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 2rem;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
            background: linear-gradient(135deg, var(--accent) 0%, var(--text) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-dim);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .price-overview {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        
        .price-item {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
        }
        
        .price-size {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 1rem;
            color: var(--accent);
        }
        
        .price-amount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            color: var(--text-dim);
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        
        .storage-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .storage-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .storage-card:hover::before {
            transform: scaleX(1);
        }
        
        .storage-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        
        .storage-card.occupied {
            background: var(--surface-elevated);
        }
        
        .storage-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }
        
        .storage-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        
        .status-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .status-badge.vacant {
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        
        .status-badge.occupied {
            background: rgba(255, 170, 0, 0.1);
            color: var(--warning);
            border: 1px solid var(--warning);
        }
        
        .storage-info {
            margin: 1rem 0;
            font-size: 0.875rem;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .info-value {
            font-weight: 500;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            padding: 2rem 1rem;
            overflow-y: auto;
            animation: fadeIn 0.2s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        
        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            padding: 2rem;
            margin: 2rem 0;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        .modal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 800;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .close-btn:hover {
            color: var(--accent);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
        }
        
        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: var(--accent);
            color: var(--bg);
        }
        
        .btn-primary:hover {
            background: var(--accent-dim);
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: var(--surface-elevated);
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            border-color: var(--accent);
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-danger:hover {
            background: #cc2952;
        }
        
        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .history-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }
        
        .history-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .history-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
        }
        
        .history-date {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-dim);
            font-size: 0.75rem;
        }
        
        .add-storage-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--bg);
            border: none;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .add-storage-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .modal-content {
                padding: 1.5rem;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            .price-overview {
                flex-direction: column;
                gap: 1rem;
            }
            
            .logo {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <svg class="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <path d="M100 20 L100 180 M60 60 L100 20 L140 60 M60 100 L140 100 M60 140 L140 140" stroke="black" stroke-width="8" fill="none" stroke-linecap="round"></path>
                    <text x="100" y="190" font-family="Arial Black" font-size="60" text-anchor="middle" fill="black">NBE</text>
                </svg>
                <div class="header-content">
                    <h1>MINILAGER - SVERRES GATE 17</h1>
                    <div class="subtitle">Namsos Boligeiendom AS</div>
                </div>
            </div>
            
            <div class="price-overview">
                <div class="price-item">
                    <span class="price-size">8 m²</span>
                    <span class="price-amount">899,-/mnd</span>
                </div>
                <div class="price-item">
                    <span class="price-size">10 m²</span>
                    <span class="price-amount">999,-/mnd</span>
                </div>
                <div class="price-item">
                    <span class="price-size">16 m²</span>
                    <span class="price-amount">1399,-/mnd</span>
                </div>
            </div>
        </header>
        
        <div id="storageGrid" class="grid"><div class="storage-card vacant">
                    <div class="storage-header">
                        <div class="storage-number">#01</div>
                        <div class="status-badge vacant">
                            Ledig
                        </div>
                    </div>
                    <div class="storage-info">
                        <div class="info-row">
                            <span class="info-label">Størrelse</span>
                            <span class="info-value">8 m²</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Pris per mnd</span>
                            <span class="info-value">899,-</span>
                        </div>
                </div></div><div class="storage-card vacant">
                    <div class="storage-header">
                        <div class="storage-number">#02</div>
                        <div class="status-badge vacant">
                            Ledig
                        </div>
                    </div>
                    <div class="storage-info">
                        <div class="info-row">
                            <span class="info-label">Størrelse</span>
                            <span class="info-value">10 m²</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Pris per mnd</span>
                            <span class="info-value">999,-</span>
                        </div>
                </div></div><div class="storage-card vacant">
                    <div class="storage-header">
                        <div class="storage-number">#03</div>
                        <div class="status-badge vacant">
                            Ledig
                        </div>
                    </div>
                    <div class="storage-info">
                        <div class="info-row">
                            <span class="info-label">Størrelse</span>
                            <span class="info-value">16 m²</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Pris per mnd</span>
                            <span class="info-value">1399,-</span>
                        </div>
                </div></div></div>
    </div>
    
    <button class="add-storage-btn" onclick="openAddModal()">+</button>
    
    <!-- Modal for detaljer/redigering -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Lager #</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            
            <div id="modalBody"></div>
        </div>
    </div>
    
    <script>
        // Persistent storage
        const STORAGE_KEY = 'minilager_data';
        
        function loadData() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }
        
        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }
        
        let storages = loadData();
        
        // Initial data hvis tom
        if (storages.length === 0) {
            storages = [
                { id: 1, number: '01', size: '8 m²', price: 899, status: 'vacant', tenant: null, history: [] },
                { id: 2, number: '02', size: '10 m²', price: 999, status: 'vacant', tenant: null, history: [] },
                { id: 3, number: '03', size: '16 m²', price: 1399, status: 'vacant', tenant: null, history: [] }
            ];
            saveData(storages);
        }
        
        function renderStorages() {
            const grid = document.getElementById('storageGrid');
            grid.innerHTML = '';
            
            storages.forEach(storage => {
                const card = document.createElement('div');
                card.className = `storage-card ${storage.status}`;
                card.onclick = () => openDetailModal(storage.id);
                
                let content = `
                    <div class="storage-header">
                        <div class="storage-number">#${storage.number}</div>
                        <div class="status-badge ${storage.status}">
                            ${storage.status === 'occupied' ? 'Utleid' : 'Ledig'}
                        </div>
                    </div>
                    <div class="storage-info">
                        <div class="info-row">
                            <span class="info-label">Størrelse</span>
                            <span class="info-value">${storage.size}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Pris per mnd</span>
                            <span class="info-value">${storage.price},-</span>
                        </div>
                `;
                
                if (storage.tenant) {
                    content += `
                        <div class="info-row">
                            <span class="info-label">Leietaker</span>
                            <span class="info-value">${storage.tenant.name}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Betaling</span>
                            <span class="info-value">${storage.tenant.paymentStatus || 'OK'}</span>
                        </div>
                    `;
                }
                
                content += `</div>`;
                card.innerHTML = content;
                grid.appendChild(card);
            });
        }
        
        function openDetailModal(id) {
            const storage = storages.find(s => s.id === id);
            if (!storage) return;
            
            document.getElementById('modalTitle').textContent = `Lager #${storage.number}`;
            
            let body = `
                <div class="form-group">
                    <label>Lagernummer</label>
                    <input type="text" id="editNumber" value="${storage.number}">
                </div>
                <div class="form-group">
                    <label>Størrelse</label>
                    <input type="text" id="editSize" value="${storage.size}">
                </div>
                <div class="form-group">
                    <label>Pris per måned (kr)</label>
                    <input type="number" id="editPrice" value="${storage.price || 0}">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="editStatus">
                        <option value="vacant" ${storage.status === 'vacant' ? 'selected' : ''}>Ledig</option>
                        <option value="occupied" ${storage.status === 'occupied' ? 'selected' : ''}>Utleid</option>
                    </select>
                </div>
            `;
            
            if (storage.status === 'occupied' || storage.tenant) {
                body += `
                    <div class="form-group">
                        <label>Leietaker</label>
                        <input type="text" id="editTenantName" value="${storage.tenant?.name || ''}">
                    </div>
                    <div class="form-group">
                        <label>Telefon</label>
                        <input type="text" id="editTenantPhone" value="${storage.tenant?.phone || ''}">
                    </div>
                    <div class="form-group">
                        <label>E-post</label>
                        <input type="email" id="editTenantEmail" value="${storage.tenant?.email || ''}">
                    </div>
                    <div class="form-group">
                        <label>Betalingsstatus</label>
                        <select id="editPaymentStatus">
                            <option value="OK" ${storage.tenant?.paymentStatus === 'OK' ? 'selected' : ''}>OK</option>
                            <option value="Forsinket" ${storage.tenant?.paymentStatus === 'Forsinket' ? 'selected' : ''}>Forsinket</option>
                            <option value="Purring" ${storage.tenant?.paymentStatus === 'Purring' ? 'selected' : ''}>Purring</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nøkkel/kode</label>
                        <input type="text" id="editKey" value="${storage.tenant?.key || ''}">
                    </div>
                    <div class="form-group">
                        <label>Startdato</label>
                        <input type="date" id="editStartDate" value="${storage.tenant?.startDate || ''}">
                    </div>
                    <div class="form-group">
                        <label>Notater</label>
                        <textarea id="editNotes">${storage.tenant?.notes || ''}</textarea>
                    </div>
                `;
            }
            
            body += `
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="saveStorage(${id})">Lagre</button>
                    <button class="btn btn-secondary" onclick="closeModal()">Avbryt</button>
                    <button class="btn btn-danger" onclick="deleteStorage(${id})">Slett lager</button>
                </div>
            `;
            
            if (storage.history && storage.history.length > 0) {
                body += `
                    <div class="history-section">
                        <div class="history-title">Historikk</div>
                `;
                storage.history.forEach(item => {
                    body += `
                        <div class="history-item">
                            <div class="history-date">${item.date}</div>
                            <div>${item.description}</div>
                        </div>
                    `;
                });
                body += `</div>`;
            }
            
            document.getElementById('modalBody').innerHTML = body;
            document.getElementById('detailModal').classList.add('active');
        }
        
        function saveStorage(id) {
            const storage = storages.find(s => s.id === id);
            if (!storage) return;
            
            storage.number = document.getElementById('editNumber').value;
            storage.size = document.getElementById('editSize').value;
            storage.price = parseInt(document.getElementById('editPrice').value) || 0;
            storage.status = document.getElementById('editStatus').value;
            
            if (storage.status === 'occupied') {
                const oldTenant = storage.tenant ? {...storage.tenant} : null;
                const newTenantName = document.getElementById('editTenantName')?.value;
                
                storage.tenant = {
                    name: newTenantName,
                    phone: document.getElementById('editTenantPhone')?.value || '',
                    email: document.getElementById('editTenantEmail')?.value || '',
                    paymentStatus: document.getElementById('editPaymentStatus')?.value || 'OK',
                    key: document.getElementById('editKey')?.value || '',
                    startDate: document.getElementById('editStartDate')?.value || '',
                    notes: document.getElementById('editNotes')?.value || ''
                };
                
                // Legg til historikk hvis ny leietaker
                if (!oldTenant || oldTenant.name !== newTenantName) {
                    if (!storage.history) storage.history = [];
                    if (oldTenant) {
                        storage.history.unshift({
                            date: new Date().toLocaleDateString('no-NO'),
                            description: `Leieforhold avsluttet: ${oldTenant.name}`
                        });
                    }
                    storage.history.unshift({
                        date: new Date().toLocaleDateString('no-NO'),
                        description: `Ny leietaker: ${newTenantName}`
                    });
                }
            } else {
                if (storage.tenant) {
                    if (!storage.history) storage.history = [];
                    storage.history.unshift({
                        date: new Date().toLocaleDateString('no-NO'),
                        description: `Leieforhold avsluttet: ${storage.tenant.name}`
                    });
                }
                storage.tenant = null;
            }
            
            saveData(storages);
            renderStorages();
            closeModal();
        }
        
        function deleteStorage(id) {
            if (confirm('Er du sikker på at du vil slette dette lageret?')) {
                storages = storages.filter(s => s.id !== id);
                saveData(storages);
                renderStorages();
                closeModal();
            }
        }
        
        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Nytt lager';
            
            const maxId = storages.length > 0 ? Math.max(...storages.map(s => s.id)) : 0;
            const nextNumber = String(storages.length + 1).padStart(2, '0');
            
            const body = `
                <div class="form-group">
                    <label>Lagernummer</label>
                    <input type="text" id="newNumber" value="${nextNumber}">
                </div>
                <div class="form-group">
                    <label>Størrelse</label>
                    <input type="text" id="newSize" value="8 m²">
                </div>
                <div class="form-group">
                    <label>Pris per måned (kr)</label>
                    <input type="number" id="newPrice" value="899">
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="addStorage()">Legg til</button>
                    <button class="btn btn-secondary" onclick="closeModal()">Avbryt</button>
                </div>
            `;
            
            document.getElementById('modalBody').innerHTML = body;
            document.getElementById('detailModal').classList.add('active');
        }
        
        function addStorage() {
            const maxId = storages.length > 0 ? Math.max(...storages.map(s => s.id)) : 0;
            
            const newStorage = {
                id: maxId + 1,
                number: document.getElementById('newNumber').value,
                size: document.getElementById('newSize').value,
                price: parseInt(document.getElementById('newPrice').value) || 0,
                status: 'vacant',
                tenant: null,
                history: []
            };
            
            storages.push(newStorage);
            saveData(storages);
            renderStorages();
            closeModal();
        }
        
        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }
        
        // Click outside modal to close
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
        
        // Initial render
        renderStorages();
    </script>

</body></html>
